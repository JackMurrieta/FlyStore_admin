# ============================================================================
# FLYSTORE BACKEND - PERFIL DE PRODUCCIÓN (RAILWAY)
# ============================================================================
# Este archivo se activa con: SPRING_PROFILES_ACTIVE=prod
# Todas las configuraciones usan variables de entorno
# ============================================================================

# ============================================================================
# CONFIGURACIÓN DE SUPABASE
# ============================================================================
supabase.url=${SUPABASE_URL}
supabase.publishableKey=${SUPABASE_PUBLISHABLE_KEY}
supabase.secretKey=${SUPABASE_SECRET_KEY}

# ============================================================================
# CONFIGURACIÓN DE BASE DE DATOS
# ============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Pool de conexiones (optimizado para Railway)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}

# ============================================================================
# CONFIGURACIÓN DE JPA/HIBERNATE (PRODUCCIÓN)
# ============================================================================
# NO mostrar SQL en producción
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Validar schema (NO crear/modificar tablas)
spring.jpa.hibernate.ddl-auto=validate

# Dialecto PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Deshabilitar estadísticas (overhead innecesario)
spring.jpa.properties.hibernate.generate_statistics=false

# ============================================================================
# CONFIGURACIÓN DE SPRING SECURITY (OAuth2 + JWT)
# ============================================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}

# ============================================================================
# CONFIGURACIÓN DE APLICACIÓN (URLs)
# ============================================================================
app.backend-url=${APP_BACKEND_URL}
app.frontend-url=${APP_FRONTEND_URL}

# ============================================================================
# CONFIGURACIÓN DE COOKIES HTTPONLY
# ============================================================================
# Dominio de cookies (Railway o custom domain)
app.cookie.domain=${APP_COOKIE_DOMAIN:}

# Cookies seguras (HTTPS obligatorio en producción)
app.cookie.secure=${APP_COOKIE_SECURE:true}

# ============================================================================
# CONFIGURACIÓN DE SERVIDOR
# ============================================================================
# Railway asigna puerto dinámicamente
server.port=${PORT:8080}

# Compresión de respuestas HTTP (mejora performance)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# ============================================================================
# CONFIGURACIÓN DE LOGGING (PRODUCCIÓN)
# ============================================================================
# Nivel de logs general
logging.level.root=INFO

# Logs de la aplicación FlyStore
logging.level.com.flystore=INFO

# Logs de Spring Security (solo warnings y errores)
logging.level.org.springframework.security=WARN

# Logs de Hibernate (solo warnings)
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Formato de logs para Railway
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================================================
# CONFIGURACIÓN DE VALIDACIÓN
# ============================================================================
spring.validation.enabled=true

# ============================================================================
# CONFIGURACIÓN DE JACKSON (JSON)
# ============================================================================
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=America/Mexico_City
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ============================================================================
# CONFIGURACIÓN DE ERRORES (PRODUCCIÓN)
# ============================================================================
# NO incluir stacktrace en producción (seguridad)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# ============================================================================
# ACTUATOR (Health checks para Railway)
# ============================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ============================================================================
# NOTAS
# ============================================================================
# Variables de entorno requeridas en Railway:
# - SPRING_PROFILES_ACTIVE=prod
# - SUPABASE_URL
# - SUPABASE_PUBLISHABLE_KEY
# - SUPABASE_SECRET_KEY
# - SPRING_DATASOURCE_URL
# - SPRING_DATASOURCE_USERNAME
# - SPRING_DATASOURCE_PASSWORD
# - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
# - APP_BACKEND_URL
# - APP_FRONTEND_URL
# - PORT (asignado automáticamente por Railway)
# ============================================================================
