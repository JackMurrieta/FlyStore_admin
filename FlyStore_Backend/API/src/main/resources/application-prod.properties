# --- Servidor ---
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# --- Configuración de la capa de persistencia ---
spring.config.import=classpath:persistencia-prod.properties

# --- JWT de Supabase ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URL}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
spring.security.oauth2.resourceserver.jwt.audiences=authenticated

# --- Supabase Auth (llamadas HTTP desde el backend) ---
supabase.url=${SUPABASE_URL}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY}
supabase.secret-key=${SUPABASE_SECRET_KEY}

# --- App ---
app.backend-url=${APP_BACKEND_URL}
app.frontend-url=${APP_FRONTEND_URL}
app.cookie.domain=${APP_COOKIE_DOMAIN:}
app.cookie.secure=${APP_COOKIE_SECURE:true}

# --- Healthcheck ---
management.endpoints.web.exposure.include=health