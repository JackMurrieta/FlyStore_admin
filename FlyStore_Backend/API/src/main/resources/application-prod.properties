# --- Servidor ---
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# --- Configuracion de la capa de persistencia ---
spring.config.import=classpath:persistencia-prod.properties

# --- JWT de Supabase ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URL}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
spring.security.oauth2.resourceserver.jwt.audiences=authenticated

# --- Supabase Auth (llamadas HTTP desde el backend) ---
supabase.url=${SUPABASE_URL}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:productos}
supabase.comprobantes-bucket=${SUPABASE_COMPROBANTES_BUCKET:comprobantes}

# --- CU-02 Gestionar venta ---
app.ventas.zona-horaria=${APP_VENTAS_ZONA_HORARIA:America/Hermosillo}
app.ventas.whatsapp=${APP_VENTAS_WHATSAPP:}
app.ventas.vencimiento.intervalo-ms=${APP_VENTAS_VENCIMIENTO_INTERVALO_MS:900000}
# CU-04: aviso al cliente por WhatsApp. Vacío = no se envía y el personal avisa a mano desde el panel.
app.whatsapp.api-url=${APP_WHATSAPP_API_URL:}
app.whatsapp.token=${APP_WHATSAPP_TOKEN:}

# --- App ---
app.backend-url=${APP_BACKEND_URL}
app.frontend-url=${APP_FRONTEND_URL}
app.cookie.domain=${APP_COOKIE_DOMAIN:}
app.cookie.secure=${APP_COOKIE_SECURE:true}

# --- Healthcheck ---
management.endpoints.web.exposure.include=health
